[package]
name = "lara-ai"
version = "0.1.0"
edition = "2021"
authors = ["Heriyanto Binduni <hbinduni@gmail.com>"]
description = "A Cloudflare Worker that integrates with Groq AI for LLM capabilities"
license = "MIT"
repository = "https://github.com/hbinduni/lara-ai.git"

[package.metadata.release]
release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7" }
worker-macros = { version = "0.6.0" }
console_error_panic_hook = { version = "0.1.7" }
serde_json = "1.0"
